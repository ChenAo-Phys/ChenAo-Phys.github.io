# Publish the site from this private source repo to the public
# ChenAo-Phys/ChenAo-Phys.github.io repo, which GitHub Pages serves at
# https://chenao-phys.github.io/.
#
# Only the files the site needs are published (index.html + assets/),
# excluding the CV LaTeX source. CLAUDE.md, contents.md and README.md stay private.
#
# Requires a repository secret DEPLOY_KEY: the private half of an SSH key
# whose public half is a *write* deploy key on ChenAo-Phys.github.io.

name: Deploy to ChenAo-Phys.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets _site/
          find _site -name '*.tex' -delete
          touch _site/.nojekyll

      - name: Push to ChenAo-Phys.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: ChenAo-Phys/ChenAo-Phys.github.io
          publish_branch: main
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Deploy ${{ github.sha }}
